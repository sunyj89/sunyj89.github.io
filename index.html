<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盯着 table</title>
  <meta name="description" content="盯着 table：记录有意思的 AI 文章与盯着相关内容。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="hero">
      <p class="kicker">AI 观察笔记</p>
      <h1>盯着 table</h1>
      <p class="bio">记录有意思的 AI 文章和盯着相关内容。每条含原文链接、总结和关键字。</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="查询方式">
      <button type="button" class="tab is-active" role="tab" data-view="latest" aria-selected="true">每日最新</button>
      <button type="button" class="tab" role="tab" data-view="person" aria-selected="false">按人物</button>
    </nav>

    <div id="person-bar" class="person-bar" hidden aria-label="人物筛选"></div>

    <section class="feed" aria-labelledby="view-label">
      <h2 id="view-label">每日最新</h2>
      <div id="post-list" class="post-list"></div>
      <p id="empty" class="empty" hidden>暂无条目。</p>
    </section>

    <section class="about" aria-labelledby="about-heading">
      <h2 id="about-heading">说明</h2>
      <p>当前列表是示例占位，方便演示「每日最新」和「按人物」查询。真实盯着素材由内容整理后替换。</p>
    </section>
  </main>
  <footer>
    <p>盯着 table</p>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
